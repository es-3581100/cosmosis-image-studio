name: Cosmosis CI

on:
  push:
    branches:
      - main
      - 'recovery/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Deterministic core smoke
        run: ./scripts/core-smoke.sh
      - name: Static provenance and Offworld audit
        run: ./scripts/static-audit.sh
      - name: Dependency-resolved tests and acceptance
        run: gradle --no-daemon test acceptanceSmoke :orml-runner:installDist :orml-runner-u2net:installDist :orml-runner-bodypix:installDist :orml-runner-classifier:installDist :orml-runner-super-resolution:installDist --stacktrace
      - name: Offline provider transport contract
        env:
          COSMOSIS_PROVIDER_CONTRACT_REPORT: "build/provider-contract/report.txt"
        run: |
          gradle --no-daemon providerContractSmoke --stacktrace
          grep -F "PROVIDER_CONTRACT_SMOKE_PASS" build/provider-contract/report.txt
          grep -F "PROVIDER_CAPABILITY_CONTRACT_PASS" build/provider-contract/report.txt
          grep -F "network=loopback-only" build/provider-contract/report.txt
          grep -F "requests=9" build/provider-contract/report.txt
          grep -F "unsupported-http-requests=0" build/provider-contract/report.txt
          cat build/provider-contract/report.txt
      - name: Preserve provider contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmosis-provider-contract
          path: build/provider-contract/
          if-no-files-found: warn
      - name: ORML runner distribution smoke
        run: |
          RUNNER="orml-runner/build/install/orml-runner/bin/orml-runner"
          test -x "$RUNNER"
          "$RUNNER" --describe | grep -F '"protocolVersion":"1"'
          "$RUNNER" --self-test > /tmp/cosmosis-orml-runner-self-test.json
          grep -F '"smart-subject-mask"' /tmp/cosmosis-orml-runner-self-test.json
      - name: Desktop UI runtime smoke
        env:
          COSMOSIS_UI_SMOKE: "1"
          COSMOSIS_UI_SMOKE_FRAMES: "20"
          COSMOSIS_UI_SMOKE_REPORT: "build/ui-smoke/report.txt"
          COSMOSIS_UI_SMOKE_SCREENSHOT: "build/ui-smoke/workstation.png"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          command -v xvfb-run
          mkdir -p build/ui-smoke
          set +e
          timeout --signal=TERM --kill-after=10s 75s \
            xvfb-run -a -s "-screen 0 2600x1200x24" \
            gradle --no-daemon -PcosmosisUiSmokeGlfw=true :run > build/ui-smoke/runtime.log 2>&1
          code=$?
          set -e
          cat build/ui-smoke/runtime.log
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            printf 'UI_SMOKE_FAIL\nerror=runtime-timeout\nexit=%s\n' "$code" > build/ui-smoke/report.txt
          fi
          test "$code" -eq 0
          grep -F "UI_SMOKE_PASS" build/ui-smoke/report.txt
          grep -F "layout.mode=single-window" build/ui-smoke/report.txt
          grep -F "layout.family=friendly-editor" build/ui-smoke/report.txt
          grep -F "layout.primaryFlow=generate-edit-mask" build/ui-smoke/report.txt
          grep -F "composer.directPrompt=true" build/ui-smoke/report.txt
          grep -F "history.visual=true" build/ui-smoke/report.txt
          grep -F "dock.showing=false" build/ui-smoke/report.txt
          grep -F "theme.background=#10100E" build/ui-smoke/report.txt
          grep -F "theme.foreground=#FFFFE3" build/ui-smoke/report.txt
          grep -F "theme.radius=0" build/ui-smoke/report.txt
          test -s build/ui-smoke/workstation.png
          cat build/ui-smoke/report.txt
      - name: Preserve UI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmosis-ui-smoke
          path: build/ui-smoke/
          if-no-files-found: warn
      - name: U2Net helper script syntax
        run: bash -n scripts/fetch-u2net-model.sh scripts/u2net-native-smoke.sh
      - name: U2Net backend distribution smoke
        run: |
          RUNNER="orml-runner-u2net/build/install/orml-runner-u2net/bin/orml-runner-u2net"
          test -x "$RUNNER"
          "$RUNNER" --describe > /tmp/cosmosis-u2net-describe.json
          grep -F '"protocolVersion":"1"' /tmp/cosmosis-u2net-describe.json
          grep -F '"id":"smart-subject-mask","available":false' /tmp/cosmosis-u2net-describe.json
          grep -F '"errors":[' /tmp/cosmosis-u2net-describe.json
      - name: BodyPix helper script syntax
        run: bash -n scripts/fetch-bodypix-model.sh scripts/bodypix-native-smoke.sh
      - name: BodyPix backend distribution smoke
        run: |
          RUNNER="orml-runner-bodypix/build/install/orml-runner-bodypix/bin/orml-runner-bodypix"
          test -x "$RUNNER"
          "$RUNNER" --describe > /tmp/cosmosis-bodypix-describe.json
          grep -F '"protocolVersion":"1"' /tmp/cosmosis-bodypix-describe.json
          grep -F '"id":"person-body-mask","available":false' /tmp/cosmosis-bodypix-describe.json
          grep -F '"errors":[' /tmp/cosmosis-bodypix-describe.json
      - name: Classifier helper script syntax
        run: bash -n scripts/fetch-classifier-model.sh scripts/classifier-native-smoke.sh
      - name: Classifier backend distribution smoke
        run: |
          RUNNER="orml-runner-classifier/build/install/orml-runner-classifier/bin/orml-runner-classifier"
          test -x "$RUNNER"
          "$RUNNER" --describe > /tmp/cosmosis-classifier-describe.json
          grep -F '"protocolVersion":"1"' /tmp/cosmosis-classifier-describe.json
          grep -F '"id":"image-embedding","available":false' /tmp/cosmosis-classifier-describe.json
          grep -F '"errors":[' /tmp/cosmosis-classifier-describe.json
      - name: Super-resolution helper script syntax
        run: bash -n scripts/fetch-super-resolution-model.sh scripts/super-resolution-native-smoke.sh
      - name: Super-resolution backend distribution smoke
        run: |
          RUNNER="orml-runner-super-resolution/build/install/orml-runner-super-resolution/bin/orml-runner-super-resolution"
          test -x "$RUNNER"
          "$RUNNER" --describe > /tmp/cosmosis-super-resolution-describe.json
          grep -F '"protocolVersion":"1"' /tmp/cosmosis-super-resolution-describe.json
          grep -F '"id":"super-resolution","available":false' /tmp/cosmosis-super-resolution-describe.json
          grep -F '"errors":[' /tmp/cosmosis-super-resolution-describe.json
