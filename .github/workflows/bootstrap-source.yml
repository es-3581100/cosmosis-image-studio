name: Bootstrap Cosmosis Source

on:
  push:
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 -d > /tmp/cosmosis-source.tar.gz
          mkdir -p /tmp/cosmosis-source
          tar -xzf /tmp/cosmosis-source.tar.gz -C /tmp/cosmosis-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/cosmosis-source/. .
          git config user.name "cosmosis-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Cosmosis Image Studio recovered source"
          git push origin HEAD:main
