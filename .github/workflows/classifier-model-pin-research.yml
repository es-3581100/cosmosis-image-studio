name: Classifier Model Pin Research

on:
  push:
    branches:
      - 'feat/classifier-backend'

permissions:
  contents: read

jobs:
  hash-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact pinned ORML classifier model
        run: |
          URL="https://raw.githubusercontent.com/openrndr/orml/bb6333e62b17a9a0fc12ef889bc3642428e6f4f4/orml-image-classifier/src/main/resources/tfmodels/v3-large-minimalistic_224_1.0_float.pb"
          curl --fail --location --proto '=https' --tlsv1.2 "$URL" --output /tmp/classifier.pb
          ls -l /tmp/classifier.pb
          sha256sum /tmp/classifier.pb
