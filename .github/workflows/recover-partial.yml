name: Recover Partial Cosmosis Archive

on:
  push:
    paths:
      - '.bootstrap/PARTIAL_READY'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact archive prefix
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/cosmosis-recovered
          cat .bootstrap/part-* | base64 -d > /tmp/cosmosis-source.tar.gz
          gzip -dc /tmp/cosmosis-source.tar.gz > /tmp/cosmosis-source.tar || true
          tar -xf /tmp/cosmosis-source.tar -C /tmp/cosmosis-recovered || true
          rm -rf /tmp/cosmosis-recovered/.github
          {
            echo '# Partial Archive Recovery'
            echo
            echo 'Source: exact uploaded .bootstrap archive prefix from main.'
            echo 'The archived .github directory is omitted only because the Actions token cannot push workflow files.'
            echo 'Recovery is intentionally on a separate branch; main is untouched.'
            echo
            echo 'Recovered files:'
            find /tmp/cosmosis-recovered -type f -printf '%P\n' | sort
          } > /tmp/cosmosis-recovered/RECOVERY_PARTIAL.md
          git checkout --orphan recovery/partial-source
          git rm -rf . || true
          cp -a /tmp/cosmosis-recovered/. .
          git add -A
          git config user.name "cosmosis-recovery"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "checkpoint(recovery): exact partial source archive"
          git push origin recovery/partial-source
